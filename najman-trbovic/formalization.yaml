# Palomar metadata (formalization.yaml v0.4) of this project; see README.md.
version: v0.4
project:
  name: Splitting of primes in number fields generated by points on some modular curves (partial)
  description: 'Formal statements and proofs, in Lean 4 with Mathlib, of parts of F. Najman, A. Trbović, "Splitting of primes
    in number fields generated by points on some modular curves" (Res. Number Theory 8 (2022)). For the 18 hyperelliptic models
    y² = f_N(x) of the paper (its explicit equations; their identification with the modular curves X₀(N) is not formalized),
    and quadratic fields ℚ(√D) generated by points with x ∈ ℚ and y ∉ ℚ: Theorem 2.2 (Table 2: primes that split, are unramified
    or not inert, and conditions on D), the square-residue conclusion of Theorem 2.8 (Table 3), Theorem 2.12 (infinitely many
    such fields in which a given prime ramifies, Table 4), and Theorem 2.13 with Table 7 in the corrected form of the authors''
    erratum (non-exceptional points), with the ring of integers, discriminant and residue rings of ℚ(√D). For Proposition
    3.1 (complete splitting, in cubic fields K with E(K)_tors ≅ ℤ/2 × ℤ/14, of primes of multiplicative reduction): the local
    and algebraic steps, the passage from the torsion hypothesis to a point on the model of X₁(2,14), and the splitting conclusion
    under an explicit hypothesis replacing the step of the paper''s proof that is not formalized. Also numerical checks against
    an exceptional point at level 26 and the printed Lemmas 2.6(b) and 2.9. 51 theorems and 1 definition, no sorry, only the
    axioms propext, Classical.choice and Quot.sound.'
  authors:
  - Filip Najman
  responsible_maintainers:
  - Filip Najman
  license: Apache-2.0
classification:
  arxiv:
  - math.NT
  msc2020:
  - 11G18
