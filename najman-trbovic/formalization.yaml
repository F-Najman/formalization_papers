fidelity:
  divergences: 'The curves are the paper''s explicit models (Table 1 and the models of Section 3), not modular curves; a non-exceptional
    point is a point (x, y) with x ∈ ℚ and y ∉ ℚ (FieldSpecialization), as in Definition 2.1. Table 7 is the printed table,
    with the scope corrected to non-exceptional points as in the authors'' erratum. Lemma 2.6(b) and Lemma 2.9 are false as
    printed (numerical checks lemma26b_counterexample, lemma26b_conclusion_fails, lemma29_counterexample, linked to the lemmas
    by their docstrings); squareclass_of_prime_power_residue is a corrected form of Lemmas 2.4 and 2.6 (for odd exponent it
    gives only p | D). Theorem 2.8 at p = 2 is vacuous in Lean (every integer is a square mod 2); the paper''s footnote suggests
    a stronger condition at 2, under which (N, a) = (26, 13) and (50, 5) would also be exceptions (the point with x = 1 lies
    over ℚ(i)). The Lean model Cubic.descended u of E_u has the paper''s j-invariant but c₄ and Δ different from the printed
    ones. Proposition 3.1 is proved only under an explicit hypothesis: the rational projection step (cubic_prime_splits_of_torsion_and_rational_projection),
    or for normal K the integrality of j for rational curves with a rational 2-torsion point and a Galois-stable cyclic subgroup
    of order 7, stated for an arbitrary field L (cubic_prime_splits_of_torsion_and_integral_j_at_level_fourteen; not a step
    of the paper''s proof). Two variants by a 2-torsion dichotomy hold for every prime of multiplicative reduction, without
    the congruence condition. Proposition 3.4: only the 2-adic valuation of j. residueRingEquiv is a definition whose value
    the Solution supplies; any value of its type is a ring isomorphism 𝒪/(p) ≅ (ℤ/p)[ω]. The Challenge copies the library''s
    docstrings verbatim; some mention an unpublished AI review of the paper or contain damaged LaTeX. It also defines and
    runs a command reset_aux_lemma_cache that clears Lean''s cache of auxiliary proofs between the blocks of different library
    modules; defining it adds two auxiliary constants, running it adds no declaration.'
review:
  status: statements reviewed by two AI reviewer agents, not by the author; proofs machine-checked
  reviewers: []
  notes: 'The statements were written by Codex together with the proofs. Afterwards, two AI reviewer agents (Claude Fable
    5.2), one blind and one adversarial, read them against the paper and the authors'' erratum, with Lean probes, an independent
    check that all 112 declarations of the Challenge occur verbatim in the library, comparisons of the 18 models and of Tables
    2, 3, 4 and 7 with the paper, a recomputation of Table 7 for all 450 prime–level pairs, and Sage computations of the Section
    3 models (exhibiting instances of the hypotheses of the conditional cubic-field theorems, e.g. x = 2 with K = ℚ[X]/(6X³
    + 13X² − 5X − 6)). They found no blocking problem: every compared statement means what its description says, and none
    is vacuous as far as they could check. Their minor findings are reflected in the README and in this metadata: the stale
    first README; the conditional theorems and their hypotheses (the integrality hypothesis is stated for an arbitrary field
    L); that two variants of Proposition 3.1 hold for every prime of multiplicative reduction; that the checks against Lemmas
    2.6(b) and 2.9 are bare arithmetic linked by docstrings and are not in the published erratum; that Theorem 2.8 is vacuous
    at p = 2; the descended model; the docstrings; and five compared names missing from CheckAxioms.lean (added). UNVERIFIED
    by the reviewers: the exactness of the torsion group in their Sage instances (Sage''s torsion computation was unreliable
    on these models), and the rational projection hypothesis beyond the sample checked. scripts/check_statements.py checks
    that the compared statements and the definitions they use are exactly those Codex wrote. Comparator checks the challenge
    against its solution, definitions included. The author has not reviewed the statements.'
alignment:
  namespace: NajmanTrbovic
  statements:
  - source: 'Section 2, (2): the squareclasses of D'
    lean: NajmanTrbovic.represents_iff_rational_twist
    module: NajmanTrbovic.AffinePoints
    status: proved
    note: D·s² = f_N(m, n) with gcd(m, n) = 1, n, s ≠ 0, D squarefree ≠ 1, holds iff the twist D·y² = f_N(x) has a rational
      point with y ≠ 0
  - source: 'Section 2: ℚ(√D)'
    lean: NajmanTrbovic.quadraticOrder_isIntegralClosure
    module: NajmanTrbovic.QuadraticFields
    status: proved
    note: for squarefree D, ℤ[ω] (ω = √D, or (1+√D)/2 if D ≡ 1 mod 4) is the ring of integers of ℚ(√D)
  - source: 'Section 2: ℚ(√D)'
    lean: NajmanTrbovic.numberField_discriminant
    module: NajmanTrbovic.QuadraticFields
    status: proved
    note: the discriminant of ℚ(√D) is D if D ≡ 1 (mod 4) and 4D otherwise
  - source: Theorem 2.12 (distinct fields)
    lean: NajmanTrbovic.radicand_eq_of_isomorphic
    module: NajmanTrbovic.FieldSpecialization
    status: proved
    note: ℚ(√D) ≅ ℚ(√E) over ℚ, with D, E squarefree and D ≠ 1, implies D = E
  - source: Lemmas 2.3, 2.5 (setting)
    lean: NajmanTrbovic.residueRingEquiv
    module: NajmanTrbovic.QuadraticSplitting
    status: definition whose type is the claim (value supplied by the Solution)
    note: 'a definition whose type is the claim: 𝒪/(p) ≅ (ℤ/p)[ω] as rings, for ℚ(√D)'
  - source: Theorem 2.2, column "splits"
    lean: NajmanTrbovic.table2_split
    module: NajmanTrbovic.Table2
    status: proved
    note: 'for each N and each p in the column "splits" of Table 2: p splits in every field ℚ(√D) generated by a non-exceptional
      point (𝒪/(p) ≅ 𝔽_p × 𝔽_p)'
  - source: Theorem 2.2, column "unramified"
    lean: NajmanTrbovic.table2_unramified
    module: NajmanTrbovic.Table2
    status: proved
    note: likewise, p is unramified
  - source: Theorem 2.2, column "not inert"
    lean: NajmanTrbovic.table2_not_inert
    module: NajmanTrbovic.Table2
    status: proved
    note: likewise, p is not inert (𝒪/(p) is not a domain)
  - source: 'Theorem 2.2, column D: "odd"'
    lean: NajmanTrbovic.table2_odd_radicand
    module: NajmanTrbovic.Table2
    status: proved
    note: for the levels marked "odd", D is odd
  - source: 'Theorem 2.2, column D: "> 0"'
    lean: NajmanTrbovic.table2_real
    module: NajmanTrbovic.Table2
    status: proved
    note: for the levels marked "> 0", D > 0
  - source: Theorem 2.2, the starred entries of Table 2
    lean: NajmanTrbovic.table2_refinements
    module: NajmanTrbovic.Table2
    status: proved
    note: 'N = 22: D ≡ 1, 2, 6 (mod 8); N = 30 and 35: D ≡ 0, 1 (mod 5)'
  - source: Theorem 2.2 (the odd-prime split entries)
    lean: NajmanTrbovic.table2_odd_split_residue
    module: NajmanTrbovic.SmallPrimeSplitting
    status: proved
    note: in the eight odd-prime "splits" entries, D is a nonzero square modulo p
  - source: Theorem 2.2 (real fields)
    lean: NajmanTrbovic.real_radicand_of_specialization
    module: NajmanTrbovic.RealFields
    status: proved
    note: for N = 28, 33, 40, 48, every non-exceptional point generates a real quadratic field
  - source: Lemmas 2.4 and 2.6 (2.6(b) corrected), for every prime p
    lean: NajmanTrbovic.squareclass_of_prime_power_residue
    module: NajmanTrbovic.LocalSquareclasses
    status: proved
    note: 'if D·s² ≡ pᵉ·u (mod p^(e+k)), p ∤ u, k > 0: e odd ⇒ p ∣ D; e even ⇒ p ∤ D, s = p^(e/2)·t with p ∤ t, and D·t² ≡
      u (mod pᵏ)'
  - source: Theorem 2.8, odd p
    lean: NajmanTrbovic.field_odd_ramified_imp_square
    module: NajmanTrbovic.FieldSpecialization
    status: proved
    note: 'for the 13 pairs (N, a) of Table 3: if an odd prime p ramifies in a field generated by a non-exceptional point
      on the model of level N, then a is a square mod p'
  - source: Theorem 2.8, every p
    lean: NajmanTrbovic.field_ramified_imp_square
    module: NajmanTrbovic.FieldSpecialization
    status: proved
    note: the same for every prime p; at p = 2 it says nothing, since every integer is a square mod 2
  - source: Theorem 2.12
    lean: NajmanTrbovic.infinite_ramified_field_parameters
    module: NajmanTrbovic.Infinitude
    status: proved
    note: 'for the four pairs (N, a) of Table 4 and an odd prime p with a a square mod p: infinitely many squarefree D ≠ 1
      such that ℚ(√D) is generated by a non-exceptional point and p ramifies in it'
  - source: Theorem 2.13 and Table 7, corrected
    lean: NajmanTrbovic.table7_field_iff
    module: NajmanTrbovic.FieldSpecialization
    status: proved
    note: 'for every N and every prime p ≤ 100: p is in Table 7 iff p is unramified in every quadratic field generated by
      a non-exceptional point'
  - source: erratum (Theorem 2.13)
    lean: NajmanTrbovic.exceptional26
    module: NajmanTrbovic.Errata
    status: proved
    note: the model of level 26 has a point (x, y) over ℚ(√−11) with x ∉ ℚ (an exceptional point)
  - source: erratum (Theorem 2.13)
    lean: NajmanTrbovic.eleven_ramifies_exceptional26
    module: NajmanTrbovic.Errata
    status: proved
    note: 11 divides the discriminant of ℚ(√−11) (although 11 is in Table 7 for N = 26)
  - source: Lemma 2.6(b) as printed
    lean: NajmanTrbovic.lemma26b_counterexample
    module: NajmanTrbovic.Errata
    status: proved
    note: D = 2, s = 3, a = 9, t = 1, ℓ = 6 satisfy the hypotheses of Lemma 2.6(b) …
  - source: Lemma 2.6(b) as printed
    lean: NajmanTrbovic.lemma26b_conclusion_fails
    module: NajmanTrbovic.Errata
    status: proved
    note: … but not its printed conclusion D ≡ 2a (mod 2^(ℓ−2k))
  - source: Lemma 2.9 as printed
    lean: NajmanTrbovic.lemma29_counterexample
    module: NajmanTrbovic.Errata
    status: proved
    note: f_22(1) = −7, so x = 1 gives a point over ℚ(√−7), in which 7 ramifies, while the discriminants −176 and −2816 of
      the two cubic factors of f_22 are not squares mod 7
  - source: 'Section 3: the descended model E_u'
    lean: NajmanTrbovic.Cubic.descended_invariants
    module: NajmanTrbovic.CubicModel
    status: proved
    note: c₄ and Δ of the Lean model descended u of E_u, over any field (its j is the paper's; its c₄ and Δ differ from the
      printed ones)
  - source: 'Section 3: the descended model E_u'
    lean: NajmanTrbovic.Cubic.descended_j
    module: NajmanTrbovic.CubicModel
    status: proved
    note: j(E_u) = denominator(u)·g₁₂(u)³ / jDenominator(u)
  - source: Section 3 (cusps over 𝔽_p)
    lean: NajmanTrbovic.Cubic.r_splits_mod_prime
    module: NajmanTrbovic.CubicRoots
    status: proved
    note: r(v, z) = v³ + v²z − 2vz² − z³ has three distinct roots mod p for p ≡ ±1 (mod 7)
  - source: Proposition 3.4 (the 2-adic valuation of j only)
    lean: NajmanTrbovic.Cubic.valuation_j_at_two
    module: NajmanTrbovic.CubicInvariantSplitting
    status: proved
    note: for x ∈ ℚ, v₂(j(E_x)) = −14k with k > 0
  - source: 'Section 3: the marked model'
    lean: NajmanTrbovic.Cubic.marked_j_cross_multiplication
    module: NajmanTrbovic.CubicMarkedCertificate
    status: proved
    note: a polynomial identity between the j-invariant of the marked model at (u, v) on the curve (4) and that of E_u
  - source: 'Section 3: the curve (4)'
    lean: NajmanTrbovic.Cubic.finiteChart_factors_from_root
    module: NajmanTrbovic.CubicProjection
    status: proved
    note: on the curve (4), the cubic in v at fixed u factors with roots v, −1/(v+1), −(v+1)/v
  - source: Proof of Proposition 3.1, at 2
    lean: NajmanTrbovic.Cubic.threeProjectiveLifts_at_two
    module: NajmanTrbovic.CubicLocal
    status: proved
    note: 'over ℤ₂, every fibre of the curve (4) over a primitive (u : w) has three points with distinct reductions'
  - source: Proof of Proposition 3.1, p ≡ ±1 (mod 7)
    lean: NajmanTrbovic.Cubic.threeProjectiveLifts_of_nonintegral_ratio
    module: NajmanTrbovic.CubicLocal
    status: proved
    note: 'the same over ℤ_p for p ≡ ±1 (mod 7), when (u : w) reduces to a pole of j'
  - source: Proof of Proposition 3.1
