sources:
- title: Splitting of primes in number fields generated by points on some modular curves
  authors:
  - Filip Najman
  - Antonela Trbović
  id: doi:10.1007/s40993-022-00325-w
  type: paper
  location: Res. Number Theory 8 (2022), Article 28; arXiv:2009.02485
  relationship: formalizes
  note: 'Formalized for the paper''s explicit models: Theorem 2.2 (Table 2, with the starred refinements), Lemmas 2.4 and
    2.6 (2.6(b) corrected), the square-residue conclusion of Theorem 2.8 for the 13 pairs of Table 3, Theorem 2.12 for the
    four pairs of Table 4, Theorem 2.13 and Table 7 in corrected form (non-exceptional points, all primes up to 100, level
    28 included), and the parts of Section 3 listed in the alignment; Proposition 3.1 itself only under an explicit hypothesis
    for its rational projection step (or, for normal K, the integrality of j on X₀(14)). Not formalized: the identification
    of the models and their cusps with the modular curves, the classification of exceptional points, the rational projection
    step of Proposition 3.1 (which uses the rational points of a genus-four Jacobian), and the reduction-type assertions of
    Propositions 3.3 and 3.4 except the 2-adic valuation of j.'
- title: Erratum to "Splitting of primes in number fields generated by points on some modular curves"
  authors:
  - Filip Najman
  - Antonela Trbović
  type: other
  location: https://web.math.pmf.unizg.hr/~fnajman/errata_splitting.txt
  relationship: background
  note: The authors' erratum restricts Theorem 2.13 and Table 7 to non-exceptional quadratic points and adds N = 28 to the
    list of levels; table7_field_iff formalizes this corrected statement, and exceptional26 with eleven_ramifies_exceptional26
    check an exceptional point at level 26 that violates the unrestricted statement.
- title: Models of X1(2,14) (data)
  authors:
  - Maarten Derickx
  - Andrew V. Sutherland
  type: other
  location: https://math.mit.edu/~drew/X1/X1_2_14.txt
  relationship: background
  note: The marked model of X₁(2,14) used in Section 3 follows Derickx and Sutherland's equations (linked in the Codex README);
    the Lean statements define the model explicitly.
